apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentconverter-api
  namespace: documentconverter
  labels:
    app.kubernetes.io/name: documentconverter-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: documentconverter-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: documentconverter-api
    spec:
      containers:
        - name: documentconverter-api
          image: registry.manty.co.kr/documentconverter-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: documentconverter-api-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
