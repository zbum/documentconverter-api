apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: documentconverter-api
  namespace: documentconverter
  labels:
    app.kubernetes.io/name: documentconverter-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: documentconverter-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
