apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documentconverter-api
  namespace: documentconverter
  labels:
    app.kubernetes.io/name: documentconverter-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/convert
            pathType: Prefix
            backend:
              service:
                name: documentconverter-api
                port:
                  number: 80
